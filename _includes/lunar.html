<div class="lunar lunar--{{ include.id }}" data-horizon{% if include.dog %} data-horizon-dog{% endif %}>
  <svg class="lunar-svg" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
    <defs>
      <linearGradient id="shade-{{ include.id }}" class="phase-gradient" x1="0" y1="0.5" x2="1" y2="0.5">
        <stop class="shade-a" offset="0" stop-color="#070b14" stop-opacity="0.55"/>
        <stop class="shade-b" offset="0.48" stop-color="#070b14" stop-opacity="0"/>
        <stop class="shade-c" offset="1" stop-color="#070b14" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="ground-{{ include.id }}">
        <path class="horizon-path" d="M-80 430 C 360 150 1080 150 1520 430 L 1520 720 L -80 720 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#ground-{{ include.id }})">
      <rect class="ground" x="-80" y="0" width="1680" height="760"/>
      <g class="craters"></g>
      <rect class="phase-shade" x="-80" y="0" width="1680" height="760" fill="url(#shade-{{ include.id }})"/>
    </g>
    <path class="horizon-rim" d="M-80 430 C 360 150 1080 150 1520 430" fill="none"/>
  </svg>
  {% if include.dog %}
  {% include dog.html %}
  {% endif %}
</div>
